name: Lint shell scripts

on:
  push:
    paths:
      - ".github/scripts/**"
  pull_request:
    paths:
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check scripts with shellcheck
        run: nix build -L .#checks.x86_64-linux.shellcheck
