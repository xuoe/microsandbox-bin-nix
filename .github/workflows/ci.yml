name: CI

on:
  push:
    paths-ignore:
      - "README.md"
  pull_request:
    paths-ignore:
      - "README.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      apply-release-data:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Builds the package on every supported system. The package's versionCheckHook runs
  # `msb --version` and fails the build unless it reports the packaged version.
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-latest # aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Download release data
        if: inputs.apply-release-data
        uses: actions/download-artifact@v8
        with:
          name: release-data

      - name: Apply release data
        if: inputs.apply-release-data
        run: git apply release-data.patch

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Build through the flake
        run: nix build -L

      - name: Build through default.nix
        run: nix-build default.nix
