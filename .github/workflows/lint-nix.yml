name: Lint Nix

on:
  push:
    paths:
      - "**.nix"
  pull_request:
    paths:
      - "**.nix"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting with nixfmt
        run: nix build -L .#checks.x86_64-linux.formatting
